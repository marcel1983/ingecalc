name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2t64

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: IngeCalc v__VERSION__
          releaseBody: |
            ## IngeCalc

            Hojas de cálculo de ingeniería: cálculo simbólico, unidades, matrices y gráficos.

            ### Descargas

            - **Windows:** instalador NSIS (`.exe`).
            - **Linux:** AppImage portátil y paquete `.deb`.
            - **macOS:** DMG para Apple Silicon y para Intel.

            > Las compilaciones no están firmadas. Windows puede mostrar SmartScreen y macOS puede pedir confirmación al abrir la aplicación. Verifica siempre que la descarga provenga de este repositorio.

            Consulta el [manual](https://github.com/marcel1983/ingecalc/blob/main/docs/manual.md) y las [notas de la versión](https://github.com/marcel1983/ingecalc/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
